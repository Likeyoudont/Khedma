name: Deploy Khedma

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: khedma/package-lock.json

      - name: Install dependencies
        working-directory: khedma
        run: npm ci

      - name: Build frontend
        working-directory: khedma
        env:
          VITE_STATIC_PREVIEW: "true"
        run: npm run build -- --base=/Khedma/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: khedma/dist

      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
